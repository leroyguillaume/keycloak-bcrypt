extends: default

rules:
  document-start:
    present: false
  braces:
    forbid: non-empty
  brackets:
    forbid: non-empty
  line-length: disable
  # A GitHub workflow's trigger key is a bare `on:`, which YAML 1.1 reads as a boolean.
  truthy:
    allowed-values:
      - 'true'
      - 'false'
    check-keys: false
  comments:
    min-spaces-from-content: 1
